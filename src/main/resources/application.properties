spring.application.name=temia-backend

# Base de datos (desarrollo)
spring.datasource.url=jdbc:mysql://localhost:3306/temia_db
spring.datasource.username=root
spring.datasource.password=root

# El esquema se aplica con los scripts de src/main/resources/db/
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=http://localhost:4200,http://localhost:5173

# Cloudinary
cloudinary.url=${CLOUDINARY_URL:}

# Multipart
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
